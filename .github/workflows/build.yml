name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: - run: unzip -o *.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - run: cd CinemaCam && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CinemaCam-apk
          path: CinemaCam/app/build/outputs/apk/debug/app-debug.apk
